packages:
  - "packages/*"
  - "agent-packs/*"
  - "examples/*"
  - "apps/*"

# pnpm v11 reads project settings here, not from the package.json pnpm field.
minimumReleaseAgeExclude:
  - "@esbuild/*"
  - brace-expansion
  - esbuild
  - fast-uri
  - ip-address
  - undici
verifyDepsBeforeRun: warn
overrides:
  "@assistant-ui/tap": 0.9.3
  brace-expansion: 5.0.9
  esbuild: 0.28.1
  fast-uri: 3.1.5
  fast-xml-parser: 5.10.1
  hono: 4.12.25
  postcss: 8.5.18
  sharp: 0.35.0
  shell-quote: 1.9.0
  tar: 7.5.19
  ip-address: 10.3.1
  undici: 7.29.0
  ws: 8.21.0
