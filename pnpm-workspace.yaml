packages:
  - "packages/*"
  - "agent-packs/*"
  - "examples/*"

# pnpm v11 reads project settings here, not from the package.json pnpm field.
minimumReleaseAgeExclude:
  - "@esbuild/*"
  - brace-expansion
  - esbuild
verifyDepsBeforeRun: warn
overrides:
  brace-expansion: 5.0.8
  esbuild: 0.28.1
  fast-uri: 3.1.4
  fast-xml-parser: 5.10.1
  hono: 4.12.25
  postcss: 8.5.18
  sharp: 0.35.0
  shell-quote: 1.9.0
  tar: 7.5.19
  undici: 7.28.0
  ws: 8.21.0
