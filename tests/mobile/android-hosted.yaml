appId: ${MOBILE_E2E_APP_ID}
name: Android authenticated operator surface
---
- launchApp:
    stopApp: false
- assertVisible: "Chat"
- tapOn: "Agents"
- assertVisible: "Agents"
- tapOn: "History"
- assertVisible: "History"
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Chat"
- tapOn: "Chats"
- assertVisible: "New chat"
- back
- takeScreenshot: output/mobile/android/hosted/operator-surface
- assertVisible:
    text: "Assistant MK1"
- assertVisible:
    text: "Sign in"
