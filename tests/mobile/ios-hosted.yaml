appId: ${MOBILE_E2E_APP_ID}
name: iOS authenticated operator surface
---
- launchApp:
    stopApp: false
- assertVisible: "Chat"
- tapOn: "Agents"
- assertVisible: "Agents"
- tapOn: "History"
- assertVisible: "History"
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Chat"
- tapOn: "Chats"
- assertVisible: "New chat"
- tapOn: "New chat"
- tapOn: "Message your agent"
- inputText: ${MOBILE_E2E_MESSAGE}
- tapOn: "Send message"
- assertVisible: ${MOBILE_E2E_MESSAGE}
- tapOn: "Chats"
- assertVisible: ${MOBILE_E2E_MESSAGE}
- takeScreenshot: output/mobile/ios/hosted/canonical-chat-acceptance
